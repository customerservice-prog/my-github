name: Verify platform

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: migration_test
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run runtime-check
      - name: Validate shell scripts
        run: bash -n scripts/bootstrap.sh ops/backup/*.sh ops/remote-node/install.sh
      - name: Apply database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://migration_test:migration_test@127.0.0.1:5432/migration_test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-session-secret-ci-session-secret
          MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - name: Build production images
        run: |
          docker build -f Dockerfile.control -t my-github-control:test .
          docker build -f Dockerfile.worker -t my-github-worker:test .
          docker build -f Dockerfile.agent -t my-github-agent:test .
          docker build -f ops/backup/Dockerfile -t my-github-backup:test ops/backup
      - name: Boot runtime images and health-check them
        run: |
          set -eu
          docker network create ci-runtime
          trap 'docker rm -f ci-control ci-agent ci-redis ci-postgres >/dev/null 2>&1 || true; docker network rm ci-runtime >/dev/null 2>&1 || true' EXIT

          docker run -d --name ci-postgres --network ci-runtime \
            -e POSTGRES_DB=runtime_test \
            -e POSTGRES_USER=runtime_test \
            -e POSTGRES_PASSWORD=runtime_test \
            postgres:18-alpine
          docker run -d --name ci-redis --network ci-runtime redis:8-alpine

          for i in $(seq 1 30); do
            if docker exec ci-postgres pg_isready -U runtime_test -d runtime_test >/dev/null 2>&1; then break; fi
            sleep 1
          done

          docker run -d --name ci-control --network ci-runtime -p 3100:3000 \
            -e DATABASE_URL=postgresql://runtime_test:runtime_test@ci-postgres:5432/runtime_test \
            -e REDIS_URL=redis://ci-redis:6379 \
            -e SESSION_SECRET=ci-runtime-session-secret-ci-runtime-session-secret \
            -e MASTER_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e INTERNAL_API_TOKEN=ci-internal-token-ci-internal-token \
            -e BOOTSTRAP_ADMIN_EMAIL=tester@example.test \
            -e BOOTSTRAP_ADMIN_PASSWORD=tester-password-12345 \
            my-github-control:test

          control_ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3100/api/health >/dev/null; then control_ok=1; break; fi
            sleep 1
          done
          if [ "$control_ok" -ne 1 ]; then
            docker logs ci-control
            exit 1
          fi

          CI_CONTROL_URL=http://127.0.0.1:3100 \
          CI_BOOTSTRAP_EMAIL=tester@example.test \
          CI_BOOTSTRAP_PASSWORD=tester-password-12345 \
          node scripts/ci-control-smoke.mjs

          docker run -d --name ci-agent -p 7100:7001 \
            -e AGENT_TOKEN=ci-agent-token-ci-agent-token \
            -v /var/run/docker.sock:/var/run/docker.sock \
            my-github-agent:test

          agent_ok=0
          for i in $(seq 1 30); do
            if curl -fsS -H 'authorization: Bearer ci-agent-token-ci-agent-token' http://127.0.0.1:7100/health >/dev/null; then agent_ok=1; break; fi
            sleep 1
          done
          if [ "$agent_ok" -ne 1 ]; then
            docker logs ci-agent
            exit 1
          fi

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
